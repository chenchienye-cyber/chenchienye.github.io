    // 🎯 更新單一場地的程度限制設定
    function updateCourtLimitSetting(num) {
        saveHistoryState();
        const enabledElem = document.getElementById(`climit_enable_${num}`);
        const typeElem = document.getElementById(`climit_type_${num}`);
        const lvlElem = document.getElementById(`climit_lvl_${num}`);

        const enabled = enabledElem ? enabledElem.checked : false;
        const type = typeElem ? typeElem.value : 'high';
        const lvlVal = lvlElem ? lvlElem.value : (type === 'high' ? 'blue' : 'yellow');

        courtLevelLimits[num] = {
            enabled: enabled,
            type: type,
            minLevel: (type === 'high') ? lvlVal : 'blue',
            maxLevel: (type === 'friendly') ? lvlVal : 'yellow'
        };

        buildLayout();
        updateModalUI();
        persistData();
    }

    // 🔄 切換排隊遞補模式 (shift 模式 vs direct 單場直上模式)
    function toggleQueueMode() {
        saveHistoryState();
        if (queueMode === 'shift') {
            queueMode = 'direct';
        } else {
            queueMode = 'shift';
        }
        updateModalUI();
        persistData();
    }

    function toggleCourt(num) {
        saveHistoryState();
        const rest = document.getElementById('rest');

        if (activeCourts.includes(num)) {
            if (activeCourts.length <= 1) {
                alert("至少需要保留 1 個場地開啟！");
                return;
            }
            activeCourts = activeCourts.filter(n => n !== num);

            const oldCourt = document.getElementById(`court-${num}`);
            const qIndex = activeCourts.indexOf(num);
            const qCode = queueLabels[qIndex] || num;
            const oldQueue = document.getElementById(`queue-${qCode}`);

            if (oldCourt && rest) {
                while (oldCourt.firstChild) {
                    oldCourt.firstChild.classList.remove('is-winner');
                    oldCourt.firstChild.dataset.selectedWin = "false";
                    rest.appendChild(oldCourt.firstChild);
                }
            }
            if (oldQueue && rest) {
                while (oldQueue.firstChild) {
                    rest.appendChild(oldQueue.firstChild);
                }
            }
            delete courtStartTimes[num];
        } else {
            activeCourts.push(num);
            activeCourts.sort((a, b) => a - b);
        }

        const currentData = getCurrentStateObject();
        buildLayout();
        applyStateObject(currentData);
        refreshStats();
        persistData();
        updateModalUI();
    }

    // 🏟️ 重新建造獨立分區版面（高手區、新手友善區與一般區獨立渲染）
    function buildLayout() {
        const rightCol = document.getElementById('mainRightColumn');
        if (!rightCol) return;

        rightCol.innerHTML = '';

        // 分類場地：high (高手區), friendly (新手友善區), normal (一般區)
        const highCourts = [];
        const friendlyCourts = [];
        const normalCourts = [];

        activeCourts.forEach((num, index) => {
            const limit = courtLevelLimits[num];
            const qCode = queueLabels[index] || (index + 1);
            const item = { num, index, qCode, limit };

            if (limit && limit.enabled) {
                if (limit.type === 'high') highCourts.push(item);
                else if (limit.type === 'friendly') friendlyCourts.push(item);
                else normalCourts.push(item);
            } else {
                normalCourts.push(item);
            }
        });

        // 渲染獨立區域 HTML
        const renderSection = (title, iconClass, items, cssClass) => {
            if (items.length === 0) return;

            let sectionHtml = `
                <div class="area-section ${cssClass}">
                    <div class="area-title-bar">
                        <span>${title} (${items.length} 場)</span>
                    </div>
                    
                    <!-- 該區上場區 -->
                    <div class="card" style="margin-bottom:0;">
                        <div class="card-header">
                            <div class="header-title-group">
                                <span>🟢 上場區</span>
                            </div>
                        </div>
                        <div class="sub-grid-row">
            `;

            items.forEach(obj => {
                let limitTagHtml = '';
                if (obj.limit && obj.limit.enabled) {
                    if (obj.limit.type === 'high') limitTagHtml = `<span class="court-limit-tag high">${levelTextMap[obj.limit.minLevel || 'blue']}↑</span>`;
                    else if (obj.limit.type === 'friendly') limitTagHtml = `<span class="court-limit-tag friendly">${levelTextMap[obj.limit.maxLevel || 'yellow']}↓</span>`;
                }

                sectionHtml += `
                    <div class="slot-item">
                        <div class="slot-inner">
                            <div class="card-header">
                                <div style="display:flex; align-items:center; gap:4px; flex-wrap:wrap;">
                                    <span>${obj.num} 號場</span>
                                    ${limitTagHtml}
                                    <span class="court-timer-badge" id="timer-court-${obj.num}">00:00</span>
                                </div>
                                <span class="badge" id="b-court-${obj.num}">0</span>
                            </div>
                            <div class="drop-zone" id="court-${obj.num}"></div>
                        </div>
                        <button class="finish-btn" onclick="finishMatch(${obj.num})">結束比賽</button>
                    </div>
                `;
            });

            sectionHtml += `
                        </div>
                    </div>

                    <!-- 該區對應等待區 -->
                    <div class="card" style="margin-bottom:0;">
                        <div class="card-header">
                            <div class="header-title-group">
                                <span>⏳ 等待區</span>
                            </div>
                        </div>
                        <div class="sub-grid-row">
            `;

            items.forEach(obj => {
                sectionHtml += `
                    <div class="slot-item">
                        <div class="slot-inner">
                            <div class="card-header">
                                <span>等待 ${obj.qCode}</span>
                                <span class="badge" id="b-queue-${obj.qCode}">0</span>
                            </div>
                            <div class="drop-zone" id="queue-${obj.qCode}"></div>
                        </div>
                    </div>
                `;
            });

            sectionHtml += `
                        </div>
                    </div>
                </div>
            `;

            rightCol.innerHTML += sectionHtml;
        };

        // 依序建造：高手區 ➔ 新手友善區 ➔ 一般區
        renderSection('🔥 高手專屬區域', 'high', highCourts, 'high-level');
        renderSection('🌱 新手友善區域', 'friendly', friendlyCourts, 'friendly-level');
        renderSection('🏸 一般區域', 'normal', normalCourts, 'normal-level');

        bindDropZones();
        updateCourtTimers();
    }

    function toggleDeleteMode() {
        if (!isDeleteMode) {
            isDeleteMode = true;
            document.getElementById('deleteToggleBtn')?.classList.add('active');
            document.body.classList.add('delete-mode-active');
        } else {
            isDeleteMode = false;
            document.getElementById('deleteToggleBtn')?.classList.remove('active');
            document.body.classList.remove('delete-mode-active');
        }
    }

    function deletePlayerNode(elem) {
        saveHistoryState();
        elem.remove();
        refreshStats();
        persistData();
        filterAndSortRestZone();
    }

    function saveHistoryState() {
        const currentState = getCurrentStateObject();
        undoStack.push({
            activeCourts: [...activeCourts],
            queueMode: queueMode,
            courtLevelLimits: JSON.parse(JSON.stringify(courtLevelLimits)),
            store: currentState
        });
        if (undoStack.length > MAX_HISTORY) {
            undoStack.shift();
        }
        redoStack.length = 0;
        updateUndoRedoButtons();
    }

    function updateUndoRedoButtons() {
        const uBtn = document.getElementById('undoBtn');
        const rBtn = document.getElementById('redoBtn');
        if (uBtn) uBtn.disabled = (undoStack.length === 0);
        if (rBtn) rBtn.disabled = (redoStack.length === 0);
    }

    function undo() {
        if (undoStack.length === 0) return;

        const currentState = getCurrentStateObject();
        redoStack.push({
            activeCourts: [...activeCourts],
            queueMode: queueMode,
            courtLevelLimits: JSON.parse(JSON.stringify(courtLevelLimits)),
            store: currentState
        });

        const previousStateObj = undoStack.pop();
        if (previousStateObj.activeCourts) {
            activeCourts = previousStateObj.activeCourts;
            queueMode = previousStateObj.queueMode || 'shift';
            courtLevelLimits = previousStateObj.courtLevelLimits || {};
            buildLayout();
        }
        applyStateObject(previousStateObj.store || previousStateObj);
        
        refreshStats();
        persistData();
        filterAndSortRestZone();
        updateUndoRedoButtons();
    }

    function redo() {
        if (redoStack.length === 0) return;

        const currentState = getCurrentStateObject();
        undoStack.push({
            activeCourts: [...activeCourts],
            queueMode: queueMode,
            courtLevelLimits: JSON.parse(JSON.stringify(courtLevelLimits)),
            store: currentState
        });

        const nextStateObj = redoStack.pop();
        if (nextStateObj.activeCourts) {
            activeCourts = nextStateObj.activeCourts;
            queueMode = nextStateObj.queueMode || 'shift';
            courtLevelLimits = nextStateObj.courtLevelLimits || {};
            buildLayout();
        }
        applyStateObject(nextStateObj.store || nextStateObj);

        refreshStats();
        persistData();
        filterAndSortRestZone();
        updateUndoRedoButtons();
    }

    function toggleWinnerCard(elem) {
        if (!elem.parentElement || !elem.parentElement.id.startsWith('court-')) {
            return;
        }

        const isWinner = elem.classList.contains('is-winner');
        if (isWinner) {
            elem.classList.remove('is-winner');
            elem.dataset.selectedWin = "false";
        } else {
            elem.classList.add('is-winner');
            elem.dataset.selectedWin = "true";
        }
    }

    // -------------------------------------------------------------
    // 結束比賽：精準計算比賽時間並寫入紀錄（支援過濾程度不符球員遞補）
    // -------------------------------------------------------------
    function finishMatch(courtNum) {
        const court = document.getElementById(`court-${courtNum}`);
        const rest = document.getElementById('rest');

        if (!court || !rest) return;

        const courtPlayers = Array.from(court.children);
        
        if (courtPlayers.length > 0) {
            const hasWinnerSelected = courtPlayers.some(pNode => pNode.dataset.selectedWin === "true");
            if (!hasWinnerSelected) {
                alert(`請先點擊【${courtNum} 號場】獲勝球員的名字標示贏家，才能結束比賽！`);
                return;
            }
        }

        saveHistoryState();

        const winners = [];
        const losers = [];

        courtPlayers.forEach(pNode => {
            let played = parseInt(pNode.dataset.played || 0) + 1;
            let wins = parseInt(pNode.dataset.wins || 0);

            if (pNode.dataset.selectedWin === "true") {
                wins += 1;
                winners.push(pNode.dataset.name);
            } else {
                losers.push(pNode.dataset.name);
            }

            pNode.dataset.played = played;
            pNode.dataset.wins = wins;
            pNode.dataset.selectedWin = "false";
            pNode.classList.remove('is-winner');

            updatePlayerCardUI(pNode);
            rest.appendChild(pNode);
        });

        // 寫入對戰紀錄
        if (winners.length > 0 || losers.length > 0) {
            const endTimeObj = new Date();
            const startMs = courtStartTimes[courtNum] || endTimeObj.getTime();
            const startTimeObj = new Date(startMs);

            const durationMs = Math.max(0, endTimeObj.getTime() - startMs);
            const durationMins = Math.max(1, Math.round(durationMs / (1000 * 60)));

            const startStr = formatTimeNoSeconds(startTimeObj);
            const endStr = formatHourMinOnly(endTimeObj);

            const matchLog = {
                time: startStr,
                startTime: startStr,
                endTime: endStr,
                durationMins: durationMins,
                court: courtNum,
                winners: winners,
                losers: losers
            };

            delete courtStartTimes[courtNum];

            if (isFirebaseActive && historyDbRef) {
                historyDbRef.push(matchLog);
            } else {
                const autoKey = 'log_' + Date.now();
                rawHistoryLogs[autoKey] = matchLog;
                localStorage.setItem(`handsome10_history_logs_${clubId}`, JSON.stringify(rawHistoryLogs));
            }
        }

        // 🔄 遞補/直上邏輯：找出當前場地正對應的等待區卡片，並過濾程度限制
        const courtIndex = activeCourts.indexOf(courtNum);
        const currentQCode = queueLabels[courtIndex] || (courtIndex + 1);
        const targetQueue = document.getElementById(`queue-${currentQCode}`);

        if (targetQueue) {
            const queuePlayers = Array.from(targetQueue.children);
            queuePlayers.forEach(pNode => {
                const check = checkPlayerLevelAllowed(courtNum, pNode.dataset.level);
                if (check.allowed) {
                    court.appendChild(pNode);
                }
            });

            if (court.children.length > 0) {
                courtStartTimes[courtNum] = Date.now();
            }
        }

        // 🔄 若為預設的 shift (自動推移遞補模式)，進行後方隊列推移 (B->A, C->B...)
        if (queueMode === 'shift') {
            for (let i = 0; i < queueLabels.length - 1; i++) {
                const currCode = queueLabels[i];
                const nextCode = queueLabels[i + 1];
                const currQ = document.getElementById(`queue-${currCode}`);
                const nextQ = document.getElementById(`queue-${nextCode}`);

                if (currQ && nextQ) {
                    while (nextQ.firstChild) {
                        currQ.appendChild(nextQ.firstChild);
                    }
                }
            }
        }

        filterAndSortRestZone();
        refreshStats();
        persistData();
    }

    function createPlayer() {
        const nameInput = document.getElementById('pName');
        const genderInput = document.getElementById('pGender');
        const levelInput = document.getElementById('pLevel');
        const categoryInput = document.getElementById('pCategory');
        if (!nameInput) return;

        const val = nameInput.value.trim();
        if(!val) return;

        saveHistoryState();

        const cat = categoryInput ? categoryInput.value : "casual";
        const pId = 'p_' + Date.now();
        const pElem = makePlayerNode(pId, val, genderInput.value, levelInput.value, cat, 0, 0, false);
        
        const rest = document.getElementById('rest');
        if (rest) {
            rest.appendChild(pElem);
        }

        registerPlayerToRoster(val, genderInput.value, levelInput.value, cat);

        nameInput.value = '';
        
        filterAndSortRestZone();
        refreshStats();
        persistData();
    }

    function makePlayerNode(id, name, gender, level = "green", category = "casual", played = 0, wins = 0, isWinner = false) {
        const div = document.createElement('div');
        div.className = 'player-card' + (isWinner ? ' is-winner' : '');
        div.id = id;
        div.draggable = true;
        div.dataset.gender = gender;
        div.dataset.level = level;
        div.dataset.category = category;
        div.dataset.name = name;
        div.dataset.played = played;
        div.dataset.wins = wins;
        div.dataset.selectedWin = isWinner ? "true" : "false";

        const winRate = played > 0 ? Math.round((wins / played) * 100) : 0;
        const lvlName = levelTextMap[level] || "新手";

        div.innerHTML = `
            <div class="player-main">
                <div class="player-name-row">
                    <span class="player-name-text">${name}</span>
                    <span class="winner-tag">勝</span>
                </div>
                <div class="player-sub">
                    <span class="level-badge ${level}">${lvlName}</span>
                    <span>${played}場 | ${winRate}%</span>
                </div>
            </div>
        `;

        bindTouchEvents(div);

        return div;
    }

    function updatePlayerCardUI(elem) {
        const played = parseInt(elem.dataset.played || 0);
        const wins = parseInt(elem.dataset.wins || 0);
        const level = elem.dataset.level || "green";
        const lvlName = levelTextMap[level] || "新手";
        const winRate = played > 0 ? Math.round((wins / played) * 100) : 0;

        const subElem = elem.querySelector('.player-sub');
        if (subElem) {
            subElem.innerHTML = `
                <span class="level-badge ${level}">${lvlName}</span>
                <span>${played}場 | ${winRate}%</span>
            `;
        }
    }

    function bindDropZones() {
        document.querySelectorAll('.drop-zone').forEach(zone => {
            zone.ondragover = (e) => e.preventDefault();
            zone.ondragenter = (e) => {
                e.preventDefault();
                if (!isDeleteMode) zone.classList.add('drag-over');
            };
            zone.ondragleave = () => zone.classList.remove('drag-over');
            zone.ondrop = (e) => {
                e.preventDefault();
                zone.classList.remove('drag-over');
                if (isDeleteMode) return;

                const pId = e.dataTransfer.getData('text/plain');
                const elem = document.getElementById(pId);

                // 🎯 拖曳至上場區驗證程度限制
                if (elem && zone.id.startsWith('court-')) {
                    const cNum = parseInt(zone.id.split('-')[1]);
                    const check = checkPlayerLevelAllowed(cNum, elem.dataset.level);
                    if (!check.allowed) {
                        alert(check.msg);
                        return;
                    }
                }

                if (elem && elem.parentElement !== zone) {
                    saveHistoryState();
                    
                    if (!zone.id.startsWith('court-')) {
                        elem.classList.remove('is-winner');
                        elem.dataset.selectedWin = "false";
                    }

                    if (zone.id.startsWith('court-')) {
                        const cNum = zone.id.split('-')[1];
                        if (zone.children.length === 0 || !courtStartTimes[cNum]) {
                            courtStartTimes[cNum] = Date.now();
                        }
                    }

                    const oldParent = elem.parentElement;
                    zone.appendChild(elem);

                    if (oldParent && oldParent.id.startsWith('court-') && oldParent.children.length === 0) {
                        const oldCNum = oldParent.id.split('-')[1];
                        delete courtStartTimes[oldCNum];
                    }

                    filterAndSortRestZone();
                    refreshStats();
                    persistData();
                }
            };
        });
    }

    // 拖曳、觸控與單擊/雙擊完全分離
    function bindTouchEvents(elem) {
        let touchTargetZone = null;
        let startX = 0, startY = 0;
        let cardRect = null;
        let clickTimer = null;
        let clickCount = 0;

        elem.ondragstart = (e) => {
            if (isDeleteMode) {
                e.preventDefault();
                return;
            }
            e.dataTransfer.setData('text/plain', elem.id);
        };

        const resetCardStyle = () => {
            elem.classList.remove('dragging-touch');
            elem.style.position = '';
            elem.style.left = '';
            elem.style.top = '';
            elem.style.width = '';
            elem.style.height = '';
            elem.style.maxWidth = '';
            elem.style.maxHeight = '';
            document.querySelectorAll('.drop-zone').forEach(z => z.classList.remove('drag-over'));
        };

        const handleTapAction = () => {
            clickCount++;
            if (clickCount === 1) {
                clickTimer = setTimeout(() => {
                    if (isDeleteMode) {
                        deletePlayerNode(elem);
                    } else if (window.innerWidth <= 768 && !elem.parentElement.id.startsWith('court-')) {
                        openPlayerMoveModal(elem);
                    } else {
                        toggleWinnerCard(elem);
                        persistData();
                    }
                    clickCount = 0;
                }, 220);
            } else if (clickCount >= 2) {
                clearTimeout(clickTimer);
                clickCount = 0;
                openPersonalDetailModal(elem.dataset.name);
            }
        };

        elem.onclick = (e) => {
            if (elem.dataset.isDragging === "true") return;
            handleTapAction();
        };

        elem.ontouchstart = (e) => {
            if (isDeleteMode) return;
            const touch = e.touches[0];
            startX = touch.clientX;
            startY = touch.clientY;
            elem.dataset.isDragging = "false";
            cardRect = elem.getBoundingClientRect();
        };

        elem.ontouchmove = (e) => {
            if (isDeleteMode) return;
            const touch = e.touches[0];
            
            if (Math.abs(touch.clientX - startX) > 8 || Math.abs(touch.clientY - startY) > 8) {
                elem.dataset.isDragging = "true";
            }

            if (elem.dataset.isDragging !== "true") return;

            if (e.cancelable) e.preventDefault();

            if (!elem.classList.contains('dragging-touch')) {
                elem.classList.add('dragging-touch');
                if (cardRect && cardRect.width > 0 && cardRect.height > 0) {
                    const wStr = cardRect.width + 'px';
                    const hStr = cardRect.height + 'px';
                    elem.style.width = wStr;
                    elem.style.height = hStr;
                    elem.style.maxWidth = wStr;
                    elem.style.maxHeight = hStr;
                }
            }

            const halfW = cardRect && cardRect.width > 0 ? cardRect.width / 2 : 50;
            const halfH = cardRect && cardRect.height > 0 ? cardRect.height / 2 : 20;
            elem.style.left = (touch.clientX - halfW) + 'px';
            elem.style.top = (touch.clientY - halfH) + 'px';

            const targetElement = document.elementFromPoint(touch.clientX, touch.clientY);
            const zone = targetElement ? targetElement.closest('.drop-zone') : null;

            document.querySelectorAll('.drop-zone').forEach(z => z.classList.remove('drag-over'));
            if (zone) {
                zone.classList.add('drag-over');
                touchTargetZone = zone;
            } else {
                touchTargetZone = null;
            }
        };

        elem.ontouchend = (e) => {
            const wasDragging = (elem.dataset.isDragging === "true");
            resetCardStyle();

            if (!isDeleteMode && wasDragging && touchTargetZone && elem.parentElement !== touchTargetZone) {
                // 🎯 觸控拖曳至上場區驗證程度限制
                if (touchTargetZone.id.startsWith('court-')) {
                    const cNum = parseInt(touchTargetZone.id.split('-')[1]);
                    const check = checkPlayerLevelAllowed(cNum, elem.dataset.level);
                    if (!check.allowed) {
                        alert(check.msg);
                        touchTargetZone = null;
                        elem.dataset.isDragging = "false";
                        return;
                    }
                }

                saveHistoryState();

                if (!touchTargetZone.id.startsWith('court-')) {
                    elem.classList.remove('is-winner');
                    elem.dataset.selectedWin = "false";
                }

                if (touchTargetZone.id.startsWith('court-')) {
                    const cNum = touchTargetZone.id.split('-')[1];
                    if (touchTargetZone.children.length === 0 || !courtStartTimes[cNum]) {
                        courtStartTimes[cNum] = Date.now();
                    }
                }

                const oldParent = elem.parentElement;
                touchTargetZone.appendChild(elem);

                if (oldParent && oldParent.id.startsWith('court-') && oldParent.children.length === 0) {
                    const oldCNum = oldParent.id.split('-')[1];
                    delete courtStartTimes[oldCNum];
                }

                touchTargetZone = null;
                filterAndSortRestZone();
                refreshStats();
                persistData();
            }
            elem.dataset.isDragging = "false";
        };

        elem.ontouchcancel = () => {
            resetCardStyle();
            elem.dataset.isDragging = "false";
        };
    }

    function refreshStats() {
        const allZones = ['rest', ...activeCourts.map(n => `court-${n}`), ...queueLabels.map(c => `queue-${c}`)];
        let totalCourtsCount = 0;
        let totalQueuesCount = 0;

        activeCourts.forEach((n, idx) => {
            const qCode = queueLabels[idx] || n;
            const cz = document.getElementById(`court-${n}`);
            const qz = document.getElementById(`queue-${qCode}`);
            const cb = document.getElementById(`b-court-${n}`);
            const qb = document.getElementById(`b-queue-${qCode}`);

            if (cz && cb) {
                cb.innerText = cz.children.length;
                totalCourtsCount += cz.children.length;
            }
            if (qz && qb) {
                qb.innerText = qz.children.length;
                totalQueuesCount += qz.children.length;
            }
        });

        const rest = document.getElementById('rest');
        const bRest = document.getElementById('b-rest');
        const restCount = rest ? rest.children.length : 0;
        if (bRest) bRest.innerText = restCount;

        const mbCourts = document.getElementById('mb-courts-count');
        const mbQueues = document.getElementById('mb-queues-count');
        const mbRest = document.getElementById('mb-rest-count');
        if (mbCourts) mbCourts.innerText = totalCourtsCount;
        if (mbQueues) mbQueues.innerText = totalQueuesCount;
        if (mbRest) mbRest.innerText = restCount;
    }

    function getCurrentStateObject() {
        const courtZones = [1, 2, 3, 4, 5, 6, 7, 8].map(n => `court-${n}`);
        const queueZones = queueLabels.map(c => `queue-${c}`);
        const allPossibleZones = ['rest', ...courtZones, ...queueZones];

        const store = {};
        allPossibleZones.forEach(zId => {
            const z = document.getElementById(zId);
            if (z) {
                store[zId] = Array.from(z.children).map(node => ({
                    id: node.id,
                    name: node.dataset.name,
                    gender: node.dataset.gender,
                    level: node.dataset.level || "green",
                    category: node.dataset.category || "casual",
                    played: parseInt(node.dataset.played || 0),
                    wins: parseInt(node.dataset.wins || 0),
                    isWinner: node.dataset.selectedWin === "true"
                }));
            }
        });
        return store;
    }

    function applyStateObject(store) {
        if (!store) return;
        const courtZones = [1, 2, 3, 4, 5, 6, 7, 8].map(n => `court-${n}`);
        const queueZones = queueLabels.map(c => `queue-${c}`);
        const allPossibleZones = ['rest', ...courtZones, ...queueZones];

        allPossibleZones.forEach(zId => {
            const zone = document.getElementById(zId);
            if (zone) zone.innerHTML = '';
        });

        Object.keys(store).forEach(zId => {
            const zone = document.getElementById(zId);
            if (zone && Array.isArray(store[zId])) {
                store[zId].forEach(item => {
                    const pNode = makePlayerNode(item.id, item.name, item.gender, item.level || "green", item.category || "casual", item.played, item.wins, item.isWinner);
                    zone.appendChild(pNode);

                    registerPlayerToRoster(item.name, item.gender, item.level, item.category || "casual");
                });
            }
        });

        filterAndSortRestZone();
    }

    function persistData() {
        if (isRemoteUpdating) return;

        const store = getCurrentStateObject();
        const payload = {
            activeCourts: activeCourts,
            queueMode: queueMode,
            courtLevelLimits: courtLevelLimits,
            store: store
        };

        localStorage.setItem(`handsome10_badminton_data_${clubId}`, JSON.stringify(payload));

        if (isFirebaseActive && dbRef) {
            dbRef.set(payload).catch((err) => {
                console.error("Firebase 寫入失敗：", err);
            });
        }
    }

    function restoreData() {
        document.getElementById('displayClubTitle').innerText = currentClubName;

        if (isFirebaseActive && dbRef) {
            dbRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    isRemoteUpdating = true;
                    if (data.activeCourts && Array.isArray(data.activeCourts)) {
                        activeCourts = data.activeCourts;
                        queueMode = data.queueMode || 'shift';
                        courtLevelLimits = data.courtLevelLimits || {};
                        buildLayout();
                    }
                    applyStateObject(data.store || data);
                    refreshStats();
                    isRemoteUpdating = false;
                } else {
                    console.log("雲端資料庫為空，載入本地歷史資料...");
                    const raw = localStorage.getItem(`handsome10_badminton_data_${clubId}`);
                    if (raw) {
                        try {
                            const localData = JSON.parse(raw);
                            dbRef.set(localData);
                            return;
                        } catch(e){}
                    }
                    persistData();
                }
            }, (error) => {
                console.error("Firebase 讀取受阻，降級使用本地暫存：", error);
                restoreLocalFallback();
            });

            if (historyDbRef) {
                historyDbRef.on('value', (snapshot) => {
                    rawHistoryLogs = snapshot.val() || {};
                    if (document.getElementById('historyModal').classList.contains('active')) {
                        switchHistoryTab(currentHistoryTab);
                    }
                });
            }

            if (rosterDbRef) {
                rosterDbRef.on('value', (snapshot) => {
                    globalPlayerRoster = snapshot.val() || {};
                    if (document.getElementById('rosterModal').classList.contains('active')) {
                        renderRosterUI();
                    }
                });
            }
        } else {
            restoreLocalFallback();
        }
    }

    function restoreLocalFallback() {
        const raw = localStorage.getItem(`handsome10_badminton_data_${clubId}`);
        if (raw) {
            try {
                const data = JSON.parse(raw);
                if (data.activeCourts && Array.isArray(data.activeCourts)) {
                    activeCourts = data.activeCourts;
                    queueMode = data.queueMode || 'shift';
                    courtLevelLimits = data.courtLevelLimits || {};
                    buildLayout();
                    applyStateObject(data.store);
                } else {
                    applyStateObject(data);
                }
                refreshStats();
            } catch(err) {
                console.error("Restore Local Error:", err);
            }
        }

        const rawHistory = localStorage.getItem(`handsome10_history_logs_${clubId}`);
        if (rawHistory) {
            try {
                rawHistoryLogs = JSON.parse(rawHistory) || {};
            } catch(e){}
        }

        const rawRoster = localStorage.getItem(`handsome10_player_roster_${clubId}`);
        if (rawRoster) {
            try {
                globalPlayerRoster = JSON.parse(rawRoster) || {};
            } catch(e){}
        }

        document.getElementById('displayClubTitle').innerText = currentClubName;
    }

    // 快捷鍵控制 (Ctrl+Z: 上一步, Ctrl+Y / Cmd+Shift+Z: 下一步)
    window.addEventListener('keydown', (e) => {
        if (e.ctrlKey || e.metaKey) {
            if (e.key.toLowerCase() === 'z') {
                if (e.shiftKey) {
                    e.preventDefault();
                    redo();
                } else {
                    e.preventDefault();
                    undo();
                }
            } else if (e.key.toLowerCase() === 'y') {
                e.preventDefault();
                redo();
            }
        }
    });

    window.onload = () => {
        buildLayout();
        restoreData();
    };
</script>
</body>
